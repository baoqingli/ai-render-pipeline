[project]
name = "ai-render-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "httpx>=0.27",
    "typer>=0.12",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "ezdxf>=1.3",
    "shapely>=2.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-multipart>=0.0.32",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.5",
    "valkey>=6.1.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5", "mypy>=1.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

# 终审 Important #2：ruff 0.16 默认规则集漂移（本分支第三次工具漂移），
# 显式钉住规则范围，保证 lint 门禁可复现
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "ASYNC", "SIM", "RUF", "BLE"]
# BLE 超出评审给的清单，但本分支既定的 fail-soft 模式用 `# noqa: BLE001`
# 抑制（见 app/agents/style/graph.py）：不启用 BLE 则这些 noqa 会被 RUF100
# 判为 unused，与终审要求的「补 noqa」方向矛盾，故一并钉入。
allowed-confusables = ["，", "：", "；", "（", "）", "×"]
# 中文注释/文案按惯例使用全角标点（RUF001-003 全量误报），以上白名单放行；
# 其余易混字符（如同形异义字母）仍受 RUF001-003 约束。

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
